:root{
  --ink:#16131F; --paper:#FFFFFF; --surface:#F6F4FB; --line:#E3DEF0; --muted:#6B6480;
  --brand:#4B31E0; --brand-soft:#EDE9FF; --logo-acc:#00B8D4;
  --c-merge:#4B31E0; --c-split:#E0553D; --c-pages:#0F9B6C; --c-img:#D98A00;
  --c-render:#1585DE; --c-mark:#8B46D9; --c-num:#D63A6A; --c-conv:#0E8C93; --c-bg:#5E7C16; --c-zip:#B0430E; --c-lock:#2F4B9B; --c-crop:#8A6A00; --c-text:#0C6E5B; --c-edit:#7A2FBF;
  --c-x2xl:#1D7A46; --c-x2wd:#1B4F9C; --c-shrink:#C2410C;
  --ok:#0F9B6C; --err:#D64545;
  --shadow:0 1px 2px rgba(22,19,31,.06),0 8px 24px -12px rgba(22,19,31,.18);
  --r:14px;
}
[data-theme="dark"]{
  --ink:#F2EFFA; --paper:#1B1826; --surface:#12101A; --line:#2E2942; --muted:#9C94B4;
  --brand:#9583FF; --brand-soft:#282141; --logo-acc:#3BC3CA;
  --c-merge:#9583FF; --c-split:#FF8A72; --c-pages:#3FCB99; --c-img:#F0B429;
  --c-render:#54B0F5; --c-mark:#BE8CF0; --c-num:#FF7BA3; --c-conv:#3BC3CA; --c-bg:#A8CF3C; --c-zip:#FF9364; --c-lock:#7E9BFF; --c-crop:#E5C044; --c-text:#3ED0AC; --c-edit:#C08BFF;
  --c-x2xl:#4ED88A; --c-x2wd:#7FB0FF; --c-shrink:#FF9A5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
h1,h2,h3,.display{font-family:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;letter-spacing:.2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0}
.mark{width:34px;height:34px;flex:0 0 auto}
.mark svg{width:100%;height:100%;display:block}
.brandname{font-size:17px;font-weight:700;line-height:1.3}
.brandname small{display:block;font-family:"IBM Plex Sans Thai",sans-serif;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.iconbtn{background:var(--paper);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer}
.iconbtn:hover{border-color:var(--brand)}

/* ---------- hero ---------- */
.hero{padding:26px 0 18px}
.hero h1{margin:0 0 10px;font-size:30px;line-height:1.38;padding-top:2px}
.hero h1 span{color:var(--brand)}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.badge b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ---------- tool grid ---------- */
.grid{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 8px}
.grid>.tool{flex:1 1 calc(50% - 6px);min-width:0}
#grid{margin:18px 0 8px}
#grid .grid{margin:10px 0 0}
.star{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  cursor:pointer;color:var(--line);transition:color .16s ease,background .16s ease,transform .16s ease;z-index:2}
.star svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linejoin:round}
.star:hover{background:var(--surface);color:var(--muted);transform:scale(1.12)}
.star.on{color:#F5A524}
.star.on svg{fill:#F5A524}
.star:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cathead{display:flex;align-items:center;gap:9px;margin:24px 0 0}
.cathead:first-child{margin-top:0}
.cathead b{font-size:16px;font-weight:600;color:var(--ink)}
.cathead span{font-size:12.5px;color:var(--muted)}
.cathead i{flex:1;height:1px;background:var(--line);display:block}
.cathead em{font-style:normal;width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--catc)}
.cathead em svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:700px){.grid>.tool{flex:1 1 calc(33.333% - 8px)}}
.tool{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px 14px;text-align:left;cursor:pointer;color:var(--ink);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.tool::before{content:"";position:absolute;top:-1px;left:16px;width:38px;height:5px;border-radius:0 0 4px 4px;background:var(--tc)}
.tool:hover{transform:translateY(-3px);border-color:var(--tc);box-shadow:var(--shadow)}
.tool:focus-visible{outline:3px solid var(--tc);outline-offset:2px}
.tool .ico{position:relative;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:11px}
.tool .ico::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--tc);opacity:.13;transition:transform .18s ease,opacity .18s ease}
.tool:hover .ico::before{opacity:.22;transform:scale(1.07)}
.tool svg{position:relative;width:24px;height:24px;display:block;stroke:var(--tc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool svg .fl{fill:var(--tc);fill-opacity:.28;stroke:none}

.panel{display:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}

  font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;flex:0 0 auto}

/* ---------- dropzone : sheet with folded corner ---------- */
.drop{position:relative;border:2px dashed var(--line);border-radius:12px;background:var(--surface);
  padding:26px 16px;text-align:center;cursor:pointer;transition:.18s;

  border:1px solid var(--line);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--muted)}
.files .th img{width:100%;height:100%;object-fit:cover;display:block}

  border:1px solid var(--line);border-radius:var(--r)}

  border:1px solid var(--line);display:grid;place-items:center;padding:6px;text-align:center}
.pv .pvim img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:4px}
.pv .pvload{font-size:11.5px;color:var(--muted);line-height:1.55}
.pv .pvmeta{min-width:0}
.pv .pvnm{display:block;font-size:14px;font-weight:600;word-break:break-word;margin-bottom:3px}
.pv .pvsz{display:block;font-size:12.5px;color:var(--muted)}
.pv .pvtip{display:block;font-size:12px;color:var(--muted);margin-top:7px;opacity:.85}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:8px;width:28px;height:28px;
  cursor:pointer;color:var(--ink);font-size:13px;line-height:1;flex:0 0 auto}

.mini[disabled]{opacity:.3;cursor:not-allowed}

label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],select{width:100%;padding:10px 11px;border:1px solid var(--line);

.go[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.prog{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}

.note.on{display:block}
.note.ok{background:rgba(15,155,108,.12);color:var(--ok)}
.note.err{background:rgba(214,69,69,.12);color:var(--err)}

.tools2{display:flex;gap:8px;margin-top:10px}

  border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px}

.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}

    if(px[i][k]>mx[k])mx[k]=px[i][k];}
  return [mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]];
}
function palette(d,max){
  const pts=[],step=Math.max(1,Math.floor(d.length/4/16000))*4;
  for(let i=0;i<d.length;i+=step)pts.push([d[i],d[i+1],d[i+2]]);
  let boxes=[pts];
  while(boxes.length<max){
    let bi=-1,best=-1;
    for(let i=0;i<boxes.length;i++){
      if(boxes[i].length<2)continue;
      const s=spread(boxes[i]),m=Math.max(s[0],s[1],s[2]);
      if(m>best){best=m;bi=i;}}
    if(bi<0||best<=0)break;
    const b=boxes[bi],s=spread(b),ch=s.indexOf(Math.max(s[0],s[1],s[2]));
    b.sort((p,q)=>p[ch]-q[ch]);
    const mid=b.length>>1;
    boxes.splice(bi,1,b.slice(0,mid),b.slice(mid));
  }
  return boxes.filter(b=>b.length).map(b=>{
    let r=0,g=0,bl=0;
    for(let i=0;i<b.length;i++){r+=b[i][0];g+=b[i][1];bl+=b[i][2];}
    return [Math.round(r/b.length),Math.round(g/b.length),Math.round(bl/b.length)];});

function lzwEncode(idx,minCode){

  const reset=()=>{dict=new Map();next=eoi+1;size=minCode+1;};

    const k=idx[i],key=prefix*256+k;
    if(dict.has(key)){prefix=dict.get(key);continue;}
    push(prefix);

const THUMB=new WeakMap();   /* จำภาพตัวอย่างไว้ ไม่ต้องสร้างซ้ำเวลาเรียงหรือลบไฟล์ */
async function thumbOf(f,size){
  size=size||140;
  if(THUMB.has(f))return THUMB.get(f);
  const job=(async()=>{
    if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){
      const doc=await pdfjsLib.getDocument({data:(await bufOf(f)).slice(0)}).promise;
      const pg=await doc.getPage(1), v1=pg.getViewport({scale:1});
      const sc=size/Math.max(v1.width,v1.height), vp=pg.getViewport({scale:sc});
      const c=el("canvas");c.width=Math.max(1,Math.ceil(vp.width));c.height=Math.max(1,Math.ceil(vp.height));
      const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;
      return {url:c.toDataURL("image/jpeg",.82),pages:doc.numPages};
    }
    if(isImgFile(f)){
      const c0=await fileToCanvas(f), W=c0.width, H=c0.height;
      const c=resizeCanvas(c0,size);
      return {url:c.toDataURL("image/jpeg",.82),w:W,h:H};
    }
    return null;
  })().catch(()=>null);
  THUMB.set(f,job);
  return job;
}

    (wantImg?"รองรับ JPG · PNG · WebP · AVIF · HEIC · TIFF · SVG · BMP · GIF · ICO":"รองรับไฟล์ PDF")+(multiple?" · เลือกได้หลายไฟล์":"")+"</small>";

  const pick=fs=>{if(showPv&&fs[0])showPv(fs[0]);onPick(fs);};

const FAV_KEY="docdesk_favs";
function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY)||"[]");}catch(e){return[];}}
function setFavs(a){try{localStorage.setItem(FAV_KEY,JSON.stringify(a));}catch(e){}}
function isFav(id){return getFavs().indexOf(id)>=0;}
function toggleFav(id){
  const a=getFavs(), i=a.indexOf(id);
  if(i>=0)a.splice(i,1);else a.push(id);        /* เรียงตามลำดับที่กดดาว */
  setFavs(a);return i<0;
}
function favTools(){
  const a=getFavs();
  return a.map(id=>TOOLS.find(t=>t.id===id)).filter(Boolean);
}
const STAR_PATH='<path d="m12 3.6 2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.75-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z"/>';

function card(t,i){
  const b=el("button","tool");
  b.style.setProperty("--tc","var("+t.c+")");b.style.animationDelay=(i*35)+"ms";
  const on=isFav(t.id);
  b.innerHTML='<span class="star'+(on?" on":"")+'" role="button" tabindex="0" aria-pressed="'+on+'" '+
      'aria-label="'+(on?"เอาออกจากรายการโปรด":"เพิ่มในรายการโปรด")+'" title="'+(on?"เอาออกจากรายการโปรด":"เพิ่มในรายการโปรด")+'">'+
      '<svg viewBox="0 0 24 24">'+STAR_PATH+'</svg></span>'+
    '<span class="ico"><svg viewBox="0 0 24 24">'+ICON[t.ic]+'</svg></span><b>'+t.t+"</b><small>"+t.s+"</small>";
  b.onclick=()=>open(t);
  const st=b.querySelector(".star");
  const hit=e=>{e.stopPropagation();e.preventDefault();toggleFav(t.id);drawGrid();};
  st.onclick=hit;
  st.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")hit(e);};
  return b;
}
function drawGrid(){
  grid.innerHTML="";
  let n=0;
  CATS.forEach(cat=>{
    const list = cat.g==="fav" ? favTools() : TOOLS.filter(t=>t.g===cat.g);
    if(!list.length) return;                         /* ครั้งแรกยังไม่มีประวัติ ก็ไม่ต้องแสดงหมวดใช้บ่อย */
    const head=el("div","cathead");
    head.style.setProperty("--catc","var("+cat.c+")");
    head.innerHTML='<em><svg viewBox="0 0 24 24">'+cat.ic+'</svg></em><b>'+cat.t+'</b>'+
      '<span>'+(cat.g==="fav"?cat.s:list.length+" รายการ")+'</span><i></i>';
    grid.appendChild(head);
    const box=el("div","grid");
    list.forEach(t=>box.appendChild(card(t,n++)));
    grid.appendChild(box);
  });
}

/* reusable multi-file list with reorder */
function fileList(body,files,render){
  const ul=el("ul","files");body.appendChild(ul);
  const draw=()=>{
    ul.innerHTML="";
    const thumbs=[];
    files.forEach((f,i)=>{
      const li=el("li");
      const th=el("span","th",(f.name.split(".").pop()||"?").toUpperCase().slice(0,4));
      li.appendChild(th);thumbs.push({f:f,box:th});
      li.appendChild(el("span","nm",(i+1)+". "+f.name));
      li.appendChild(el("span","sz",fmt(f.size)));
      const up=el("button","mini","↑"),dn=el("button","mini","↓"),rm=el("button","mini","✕");
      up.disabled=i===0;dn.disabled=i===files.length-1;
      up.onclick=()=>{files.splice(i-1,0,files.splice(i,1)[0]);draw();};
      dn.onclick=()=>{files.splice(i+1,0,files.splice(i,1)[0]);draw();};
      rm.onclick=()=>{files.splice(i,1);draw();};
      li.appendChild(up);li.appendChild(dn);li.appendChild(rm);
      ul.appendChild(li);
    });
    /* สร้างภาพตัวอย่างทีละไฟล์ ไม่ให้หน้าค้าง */
    (async()=>{
      for(let i=0;i<thumbs.length;i++){
        const t=await thumbOf(thumbs[i].f,90);
        const box=thumbs[i].box;
        if(!box.parentNode)return;
        if(t&&t.url){box.textContent="";const img=el("img");img.alt="";img.src=t.url;box.appendChild(img);}
      }
    })();
    render();
  };
  return draw;
}

const BUILD={};

/* ---------- 1) MERGE ---------- */
BUILD.merge=function(body){
  const files=[];
  dropzone(body,"application/pdf",true,fs=>{files.push.apply(files,fs);draw();});
  const draw=fileList(body,files,()=>ui.enable(files.length>=2));
  const ui=actionBar(body,"รวมไฟล์ทั้งหมด",async(u)=>{
    const out=await PDFLib.PDFDocument.create();
    for(let i=0;i<files.length;i++){
      const src=await loadPdf(await bufOf(files[i]));
      const ps=await out.copyPages(src,src.getPageIndices());
      ps.forEach(p=>out.addPage(p));
      u.prog((i+1)/files.length);await tick();
    }
    const bytes=await out.save();
    save(new Blob([bytes],{type:"application/pdf"}),"รวมไฟล์.pdf");
    u.ok("รวมได้ "+out.getPageCount()+" หน้า จาก "+files.length+" ไฟล์ — ดาวน์โหลดแล้ว");
  });
  draw();
};

/* ---------- 2) SPLIT ---------- */
function parseRange(str,total){
  const out=[];
  const parts=String(str).split(",");
  for(let i=0;i<parts.length;i++){
    const s=parts[i].trim();if(!s)continue;
    const m=s.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){let a=+m[1],b=+m[2];if(a>b){const t=a;a=b;b=t;}
      for(let k=a;k<=b;k++)if(k>=1&&k<=total)out.push(k-1);}
    else if(/^\d+$/.test(s)){const k=+s;if(k>=1&&k<=total)out.push(k-1);}
    else throw new Error('ช่วงหน้าไม่ถูกต้องตรง "'+s+'" — ใช้รูปแบบ 1-3, 5, 8');
  }
  const seen={},res=[];
  out.forEach(v=>{if(!seen[v]){seen[v]=1;res.push(v);}});
  if(!res.length)throw new Error("ไม่มีหน้าที่ตรงกับช่วงที่ระบุ (ไฟล์นี้มี "+total+" หน้า)");
  return res;
}

    b.classList.add("on");mode=b.dataset.m;$("#rw",o).style.display=mode==="range"?"":"none";

  const ui=actionBar(body,"แยกไฟล์",async(u)=>{
    const src=await loadPdf(await bufOf(file));
    const n=src.getPageCount();
    if(mode==="range"){
      const idx=parseRange($("#rg",o).value,n);
      const out=await PDFLib.PDFDocument.create();
      const ps=await out.copyPages(src,idx);ps.forEach(p=>out.addPage(p));
      save(new Blob([await out.save()],{type:"application/pdf"}),stem(file.name)+"_แยก.pdf");
      u.ok("ดึงออกมา "+idx.length+" หน้า — ดาวน์โหลดแล้ว");
    }else{

        zip.file(stem(file.name)+"_หน้า"+(i+1)+".pdf",await out.save());

/* ---------- 3) PAGE MANAGER ---------- */
BUILD.pages=function(body){
  let bytes=null,name="",state=[];
  dropzone(body,"application/pdf",false,async fs=>{
    ui.clear();wrap.innerHTML="";state=[];
    name=fs[0].name;bytes=await bufOf(fs[0]);
    try{
      const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
      const n=doc.numPages;
      if(n>150){ui.err("ไฟล์นี้มี "+n+" หน้า แสดงตัวอย่างเฉพาะ 150 หน้าแรกเพื่อไม่ให้เครื่องค้าง");}
      const lim=Math.min(n,150);
      for(let i=1;i<=lim;i++){
        const pg=await doc.getPage(i);
        const vp=pg.getViewport({scale:1});
        const sc=140/vp.width;
        const v2=pg.getViewport({scale:sc});
        const c=el("canvas");c.width=Math.ceil(v2.width);c.height=Math.ceil(v2.height);
        await pg.render({canvasContext:c.getContext("2d"),viewport:v2}).promise;
        state.push({src:i-1,rot:0,del:false,canvas:c});
        ui.prog(i/lim);await tick();
      }
      draw();ui.enable(true);
    }catch(e){ui.err("อ่านไฟล์ไม่ได้ — อาจตั้งรหัสผ่านไว้หรือไฟล์เสียหาย");}
  },true);
  const wrap=el("div","pages");body.appendChild(wrap);
  function draw(){
    wrap.innerHTML="";
    state.forEach((p,i)=>{
      const d=el("div","pg"+(p.del?" del":""));
      p.canvas.style.transform="rotate("+p.rot+"deg)";
      d.appendChild(p.canvas);
      d.appendChild(el("div","no","หน้า "+(p.src+1)+(p.rot?" · "+p.rot+"°":"")));
      const a=el("div","acts");
      const mk=(txt,fn,title)=>{const b=el("button",null,txt);b.title=title;b.onclick=fn;a.appendChild(b);};
      mk("←",()=>{if(i>0){state.splice(i-1,0,state.splice(i,1)[0]);draw();}},"เลื่อนไปก่อนหน้า");
      mk("⟳",()=>{p.rot=(p.rot+90)%360;draw();},"หมุน 90 องศา");
      mk(p.del?"↺":"✕",()=>{p.del=!p.del;draw();},p.del?"เอากลับมา":"ลบหน้านี้");
      mk("→",()=>{if(i<state.length-1){state.splice(i+1,0,state.splice(i,1)[0]);draw();}},"เลื่อนไปถัดไป");
      d.appendChild(a);wrap.appendChild(d);
    });
  }
  const ui=actionBar(body,"บันทึกเป็น PDF ใหม่",async(u)=>{
    const keep=state.filter(p=>!p.del);
    if(!keep.length)throw new Error("ต้องเหลืออย่างน้อย 1 หน้า");
    const src=await loadPdf(bytes);
    const out=await PDFLib.PDFDocument.create();
    const ps=await out.copyPages(src,keep.map(p=>p.src));
    ps.forEach((p,i)=>{
      const base=p.getRotation().angle||0;
      p.setRotation(PDFLib.degrees((base+keep[i].rot)%360));
      out.addPage(p);
    });
    save(new Blob([await out.save()],{type:"application/pdf"}),stem(name)+"_จัดหน้าแล้ว.pdf");
    u.ok("บันทึก "+keep.length+" หน้าเรียบร้อย — ดาวน์โหลดแล้ว");
  });
};

/* ---------- 4) IMAGE -> PDF ---------- */
BUILD.img=function(body){
  const files=[];
  dropzone(body,IMG_ACCEPT,true,fs=>{files.push.apply(files,fs);draw();});
  const draw=fileList(body,files,()=>ui.enable(files.length>=1));
  const o=el("div","opts two");
  o.innerHTML='<div><label class="f">ขนาดหน้ากระดาษ</label><select id="sz">'+
    '<option value="a4">A4 แนวตั้ง</option><option value="a4l">A4 แนวนอน</option>'+
    '<option value="fit">พอดีกับขนาดรูป</option></select></div>'+
    '<div><label class="f">ระยะขอบ (พอยต์)</label><input type="number" id="mg" value="28" min="0" max="120"></div>';
  body.appendChild(o);
  const ui=actionBar(body,"แปลงเป็น PDF",async(u)=>{
    const out=await PDFLib.PDFDocument.create();
    const mode=$("#sz",o).value, mg=Math.max(0,+$("#mg",o).value||0);
    for(let i=0;i<files.length;i++){
      const f=files[i];
      let img;
      if(/\.jpe?g$/i.test(f.name)||/jpeg$/i.test(f.type)) img=await out.embedJpg(await bufOf(f));
      else if(/\.png$/i.test(f.name)||/png$/i.test(f.type)) img=await out.embedPng(await bufOf(f));
      else{ /* HEIC, TIFF, WebP, SVG, BMP → แปลงผ่าน canvas ก่อน */
        const c=resizeCanvas(await fileToCanvas(f),2400);
        const blob=await canvasToBlob(flatten(c),"jpg",.92);
        img=await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      }
      let PW,PH;
      if(mode==="fit"){PW=img.width+mg*2;PH=img.height+mg*2;}
      else if(mode==="a4l"){PW=841.89;PH=595.28;}
      else{PW=595.28;PH=841.89;}
      const mw=PW-mg*2,mh=PH-mg*2,s=Math.min(mw/img.width,mh/img.height);
      const w=img.width*s,h=img.height*s;
      const p=out.addPage([PW,PH]);
      p.drawImage(img,{x:(PW-w)/2,y:(PH-h)/2,width:w,height:h});
      u.prog((i+1)/files.length);await tick();
    }
    save(new Blob([await out.save()],{type:"application/pdf"}),"รูปภาพ.pdf");
    u.ok("สร้าง PDF "+files.length+" หน้าแล้ว — ดาวน์โหลดแล้ว");
  });
  draw();
};

    if(failed.length)u.err("แปลงไม่ได้ "+failed.length+" ไฟล์: "+failed.join(", "));

    const fs=Math.max(6,+$("#fs",o).value||11), start=Math.max(1,+$("#st",o).value||1), skip=$("#skip",o).checked;
    const list=skip?pages.slice(1):pages, total=list.length;
    for(let i=0;i<list.length;i++){
      const p=list[i], num=start+i;
      const label=fm==="n"?String(num):fm==="n/t"?num+"/"+total:fm==="thai"?("หน้า "+num+" จาก "+total):("- "+num+" -");
      const st=textPng(label,"#000000",500);
      const img=await doc.embedPng(st.url);
      const h=fs*1.35, w=h*(st.w/st.h);
      const sz=p.getSize(), M=fs*2.4;
      let x,y;
      if(ps==="c"){x=(sz.width-w)/2;y=M-h/2;}
      else if(ps==="r"){x=sz.width-M-w;y=M-h/2;}
      else if(ps==="l"){x=M;y=M-h/2;}
      else{x=sz.width-M-w;y=sz.height-M-h/2;}
      p.drawImage(img,{x:x,y:Math.max(6,y),width:w,height:h});
      u.prog((i+1)/list.length);await tick();
    }
    save(new Blob([await doc.save()],{type:"application/pdf"}),stem(file.name)+"_ใส่เลขหน้า.pdf");

  });
};

/* ---------- 9) REMOVE BACKGROUND ---------- */
/* โหมด auto : ไล่ลบสีพื้นจากขอบภาพเข้ามา ทำให้ขอบวัตถุนุ่มไม่หยัก
   โหมด ink  : เก็บเฉพาะรอยหมึกเข้ม เหมาะกับลายเซ็น ตราประทับ ตัวอักษร */
function cutout(src,opt){
  const w=src.width,h=src.height;
  const c=el("canvas");c.width=w;c.height=h;
  const cx=c.getContext("2d");cx.drawImage(src,0,0);
  const id=cx.getImageData(0,0,w,h),d=id.data;
  if(opt.mode==="ink"){
    const hi=opt.level, lo=Math.max(0,opt.level-Math.max(2,opt.soft*2));
    for(let p=0;p<d.length;p+=4){
      const lum=.299*d[p]+.587*d[p+1]+.114*d[p+2];
      const a=lum>=hi?0:lum<=lo?255:Math.round(255*(hi-lum)/(hi-lo));
      if(a<d[p+3])d[p+3]=a;
    }
  }else{
    const tol=opt.tol, soft=Math.max(1,opt.soft), R=opt.rgb[0],G=opt.rgb[1],B=opt.rgb[2];
    const alphaOf=(r,g,b)=>{
      const dist=Math.sqrt((r-R)*(r-R)+(g-G)*(g-G)+(b-B)*(b-B));
      if(dist<=tol)return 0;
      if(dist>=tol+soft)return 255;
      return Math.round(255*(dist-tol)/soft);
    };
    if(opt.global){
      for(let p=0;p<d.length;p+=4){const a=alphaOf(d[p],d[p+1],d[p+2]);if(a<d[p+3])d[p+3]=a;}
    }else{
      const seen=new Uint8Array(w*h), st=new Int32Array(w*h+8);
      let sp=0;
      const push=i=>{if(!seen[i]){seen[i]=1;st[sp++]=i;}};
      for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}
      for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
      while(sp>0){
        const i=st[--sp], p=i*4;
        const a=alphaOf(d[p],d[p+1],d[p+2]);
        if(a===255)continue;              /* ถึงขอบวัตถุแล้ว หยุดลาม */
        if(a<d[p+3])d[p+3]=a;
        const x=i%w, y=(i-x)/w;
        if(x>0)push(i-1); if(x<w-1)push(i+1);
        if(y>0)push(i-w); if(y<h-1)push(i+w);
      }
    }
  }
  cx.putImageData(id,0,0);
  if(opt.fill&&opt.fill!=="none"){
    const o=el("canvas");o.width=w;o.height=h;
    const ox=o.getContext("2d");ox.fillStyle=opt.fill;ox.fillRect(0,0,w,h);ox.drawImage(c,0,0);
    return o;
  }
  return c;
}
function borderColor(c){ /* เดาสีพื้นจากพิกเซลรอบขอบภาพ */
  const x=c.getContext("2d"),w=c.width,h=c.height,px=[];
  const take=(a,b)=>{const p=x.getImageData(a,b,1,1).data;px.push([p[0],p[1],p[2]]);};
  const n=Math.min(40,Math.max(8,Math.floor(w/12)));
  for(let i=0;i<n;i++){const a=Math.floor(i*(w-1)/(n-1));take(a,0);take(a,h-1);}
  for(let i=0;i<n;i++){const b=Math.floor(i*(h-1)/(n-1));take(0,b);take(w-1,b);}
  const s=px.reduce((t,p)=>[t[0]+p[0],t[1]+p[1],t[2]+p[2]],[0,0,0]);
  return s.map(v=>Math.round(v/px.length));
}
const hexOf=rgb=>"#"+rgb.map(v=>("0"+v.toString(16)).slice(-2)).join("");
const unhex=s=>[parseInt(s.substr(1,2),16),parseInt(s.substr(3,2),16),parseInt(s.substr(5,2),16)];

BUILD.zip=function(body){
  let file=null;
  dropzone(body,"application/pdf",false,fs=>{file=fs[0];info.textContent="📄 "+file.name+" · "+fmt(file.size);ui.enable(true);ui.clear();});
  const info=el("div","badge");info.style.marginTop="12px";body.appendChild(info);
  const o=el("div","opts two");
  o.innerHTML='<div><label class="f">ระดับการบีบอัด</label><select id="lv">'+
      '<option value="150|0.85">คุณภาพสูง — เก็บรายละเอียดไว้มาก</option>'+
      '<option value="110|0.72" selected>สมดุล — แนะนำสำหรับแนบอีเมล</option>'+
      '<option value="72|0.6">เล็กที่สุด — อ่านบนจอพอได้</option></select></div>'+
    '<div><label class="f">โทนสี</label><select id="gs"><option value="0">คงสีเดิม</option>'+
      '<option value="1">ขาวดำ — ไฟล์เล็กลงอีกมาก</option></select></div>';
  body.appendChild(o);
  body.appendChild(el("div","warn","ℹ️ วิธีนี้แปลงทุกหน้าเป็นภาพ ไฟล์จะเล็กลงมากโดยเฉพาะเอกสารสแกน แต่ข้อความในไฟล์ผลลัพธ์จะค้นหาและคัดลอกไม่ได้"));
  const ui=actionBar(body,"บีบอัดไฟล์",async(u)=>{
    const bytes=await bufOf(file);
    const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
    const parts=$("#lv",o).value.split("|"), dpi=+parts[0], q=+parts[1], gray=$("#gs",o).value==="1";
    const out=await PDFLib.PDFDocument.create();
    const n=doc.numPages;
    for(let i=1;i<=n;i++){
      const pg=await doc.getPage(i);
      const base=pg.getViewport({scale:1});
      const vp=pg.getViewport({scale:dpi/72});
      const c=el("canvas");c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
      const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;
      if(gray){
        const id=cx.getImageData(0,0,c.width,c.height),d=id.data;
        for(let p=0;p<d.length;p+=4){const v=.299*d[p]+.587*d[p+1]+.114*d[p+2];d[p]=d[p+1]=d[p+2]=v;}
        cx.putImageData(id,0,0);
      }
      const blob=await canvasToBlob(c,"jpg",q);
      const img=await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      const page=out.addPage([base.width,base.height]);
      page.drawImage(img,{x:0,y:0,width:base.width,height:base.height});
      u.prog(i/n);await tick();
    }
    const res=await out.save();
    const pct=Math.round((1-res.length/file.size)*100);
    save(new Blob([res],{type:"application/pdf"}),stem(file.name)+"_บีบอัด.pdf");
    u.ok(fmt(file.size)+" → "+fmt(res.length)+(pct>0?" (เล็กลง "+pct+"%)":" (ไฟล์นี้เล็กลงไม่ได้อีก ลองระดับที่ต่ำกว่า)")+" — ดาวน์โหลดแล้ว");
  });
};

BUILD.lock=function(body){
  let file=null,locked=false;
  if(typeof PDFLib.PDFDocument.prototype.encrypt!=="function"){
    body.appendChild(el("div","warn","⚠️ โหลดไลบรารีเข้ารหัสไม่สำเร็จ ลองเปิดหน้านี้ใหม่ขณะต่ออินเทอร์เน็ต"));
  }
  dropzone(body,"application/pdf",false,async fs=>{
    file=fs[0];ui.clear();
    try{
      const peek=await PDFLib.PDFDocument.load((await bufOf(file)).slice(0),{ignoreEncryption:true});
      locked=!!peek.isEncrypted;
    }catch(e){locked=true;}
    info.textContent=(locked?"🔒 ":"📄 ")+file.name+(locked?" · ไฟล์นี้ตั้งรหัสไว้อยู่แล้ว":" · ยังไม่ได้ตั้งรหัส");
    setMode(locked?"off":"on");ui.enable(true);
  });
  const info=el("div","badge");info.style.marginTop="12px";body.appendChild(info);
  const o=el("div","opts two");
  o.innerHTML='<div style="grid-column:1/-1"><label class="f">ต้องการทำอะไร</label><div class="seg" id="md">'+
      '<button class="on" data-m="on">ใส่รหัสผ่าน</button><button data-m="off">ปลดรหัสผ่าน</button></div></div>'+
    '<div><label class="f" id="l1">รหัสสำหรับเปิดไฟล์</label><input type="text" id="p1" placeholder="ตั้งรหัสที่จำได้"></div>'+
    '<div id="ow"><label class="f">รหัสเจ้าของ (ไม่ใส่ก็ได้)</label><input type="text" id="p2" placeholder="ใช้แก้สิทธิ์ภายหลัง"></div>'+
    '<div style="grid-column:1/-1" id="pm"><label class="f">สิทธิ์ของผู้ที่เปิดด้วยรหัสนี้</label>'+
      '<label class="chk" style="margin-bottom:6px"><input type="checkbox" id="cp" checked> พิมพ์ออกกระดาษได้</label>'+
      '<label class="chk" style="margin-bottom:6px"><input type="checkbox" id="cc"> คัดลอกข้อความออกได้</label>'+
      '<label class="chk"><input type="checkbox" id="ce"> แก้ไขเนื้อหาได้</label></div>';
  body.appendChild(o);
  const warn=el("div","warn","🔑 รหัสผ่านสร้างและตรวจในเครื่องนี้เท่านั้น ไม่มีใครกู้คืนให้ได้ถ้าลืม — จดเก็บไว้ก่อนบันทึกไฟล์");
  body.appendChild(warn);
  let mode="on";
  function setMode(m){
    mode=m;
    [].forEach.call(o.querySelectorAll("#md button"),x=>x.classList.toggle("on",x.dataset.m===m));
    $("#l1",o).textContent=m==="on"?"รหัสสำหรับเปิดไฟล์":"รหัสเดิมของไฟล์นี้";
    $("#ow",o).style.display=m==="on"?"":"none";
    $("#pm",o).style.display=m==="on"?"":"none";
    warn.style.display=m==="on"?"":"none";
    ui.btn.textContent=m==="on"?"ใส่รหัสผ่าน":"ปลดรหัสผ่าน";
  }
  [].forEach.call(o.querySelectorAll("#md button"),b=>b.onclick=()=>setMode(b.dataset.m));
  const ui=actionBar(body,"ใส่รหัสผ่าน",async(u)=>{
    const pw=$("#p1",o).value;
    if(!pw)throw new Error(mode==="on"?"กรุณาตั้งรหัสผ่านก่อน":"กรุณากรอกรหัสเดิมของไฟล์");
    const bytes=await bufOf(file);
    if(mode==="on"){
      if(locked)throw new Error("ไฟล์นี้มีรหัสอยู่แล้ว — ปลดรหัสเดิมก่อนจึงตั้งรหัสใหม่ได้");
      const doc=await PDFLib.PDFDocument.load(bytes.slice(0));
      doc.encrypt({
        userPassword:pw,
        ownerPassword:$("#p2",o).value||pw+"_owner",
        permissions:{printing:$("#cp",o).checked?"highResolution":false,
          copying:$("#cc",o).checked,modifying:$("#ce",o).checked,
          annotating:$("#ce",o).checked,contentAccessibility:true}
      });
      u.prog(.7);await tick();
      save(new Blob([await doc.save()],{type:"application/pdf"}),stem(file.name)+"_ล็อก.pdf");
      u.ok("ล็อกไฟล์ด้วย AES-256 แล้ว — ต้องใส่รหัสทุกครั้งที่เปิด");
    }else{
      let src;
      try{ src=await PDFLib.PDFDocument.load(bytes.slice(0),{password:pw}); }
      catch(e){ throw new Error("รหัสผ่านไม่ถูกต้อง หรือไฟล์นี้ใช้การเข้ารหัสที่รองรับไม่ได้"); }
      const out=await PDFLib.PDFDocument.create();
      const ps=await out.copyPages(src,src.getPageIndices());
      ps.forEach(p=>out.addPage(p));
      u.prog(.8);await tick();
      save(new Blob([await out.save()],{type:"application/pdf"}),stem(file.name)+"_ปลดรหัส.pdf");
      u.ok("ปลดรหัสแล้ว "+out.getPageCount()+" หน้า — เปิดได้โดยไม่ต้องใส่รหัส");
    }
  });
  setMode("on");
};

BUILD.crop=function(body){
  let file=null,bytes=null,base=null,pageCount=0;
  let box={x:.08,y:.08,w:.84,h:.84};
  dropzone(body,"application/pdf",false,async fs=>{
    file=fs[0];ui.clear();
    try{
      bytes=await bufOf(file);
      const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
      pageCount=doc.numPages;
      const pg=await doc.getPage(1);
      const v1=pg.getViewport({scale:1});
      const vp=pg.getViewport({scale:Math.min(2,620/v1.width)});
      base=el("canvas");base.width=Math.ceil(vp.width);base.height=Math.ceil(vp.height);
      await pg.render({canvasContext:base.getContext("2d"),viewport:vp}).promise;
      cv.width=base.width;cv.height=base.height;cv.getContext("2d").drawImage(base,0,0);
      info.textContent="📄 "+file.name+" · "+pageCount+" หน้า";
      wrap.style.display="";ui.enable(true);draw();
    }catch(e){ui.err("เปิดไฟล์ไม่ได้ — อาจตั้งรหัสผ่านไว้");}
  },true);
  const info=el("div","badge");info.style.marginTop="12px";body.appendChild(info);

  const wrap=el("div","preview");wrap.style.display="none";
  const stage=el("div","cropstage");
  const cv=el("canvas");stage.appendChild(cv);
  const cbox=el("div","cbox");
  cbox.innerHTML='<b data-h="nw"></b><b data-h="ne"></b><b data-h="sw"></b><b data-h="se"></b>';
  stage.appendChild(cbox);wrap.appendChild(stage);
  const hint=el("div","hint","ลากกรอบเพื่อเลือกพื้นที่ที่จะเก็บไว้ · ลากจุดมุมเพื่อย่อขยาย");
  wrap.appendChild(hint);body.appendChild(wrap);

  const MIN=.05, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function draw(){
    cbox.style.left=(box.x*100)+"%";cbox.style.top=(box.y*100)+"%";
    cbox.style.width=(box.w*100)+"%";cbox.style.height=(box.h*100)+"%";
    size.textContent="เก็บไว้ "+Math.round(box.w*100)+"% × "+Math.round(box.h*100)+
      " % · ตัดออก ซ้าย "+Math.round(box.x*100)+"% ขวา "+Math.round((1-box.x-box.w)*100)+
      "% บน "+Math.round(box.y*100)+"% ล่าง "+Math.round((1-box.y-box.h)*100)+"%";
  }
  let drag=null;
  stage.addEventListener("pointerdown",ev=>{
    if(!base)return;
    const h=ev.target&&ev.target.dataset?ev.target.dataset.h:null;
    if(!h&&ev.target!==cbox)return;
    const r=stage.getBoundingClientRect();
    drag={h:h||"move",px:(ev.clientX-r.left)/r.width,py:(ev.clientY-r.top)/r.height,st:Object.assign({},box)};
    stage.setPointerCapture(ev.pointerId);ev.preventDefault();
  });
  stage.addEventListener("pointermove",ev=>{
    if(!drag)return;
    const r=stage.getBoundingClientRect();
    const dx=(ev.clientX-r.left)/r.width-drag.px, dy=(ev.clientY-r.top)/r.height-drag.py, o=drag.st;
    if(drag.h==="move"){
      box.x=clamp(o.x+dx,0,1-o.w);box.y=clamp(o.y+dy,0,1-o.h);box.w=o.w;box.h=o.h;
    }else{
      let l=o.x,t=o.y,rr=o.x+o.w,bb=o.y+o.h;
      if(drag.h[1]==="w")l=clamp(o.x+dx,0,rr-MIN); else rr=clamp(o.x+o.w+dx,l+MIN,1);
      if(drag.h[0]==="n")t=clamp(o.y+dy,0,bb-MIN); else bb=clamp(o.y+o.h+dy,t+MIN,1);
      box={x:l,y:t,w:rr-l,h:bb-t};
    }
    draw();
  });
  ["pointerup","pointercancel"].forEach(e=>stage.addEventListener(e,()=>{drag=null;}));

  const o=el("div","opts two");
  o.innerHTML='<div style="grid-column:1/-1"><label class="f">ทางลัด</label><div class="seg" id="qk">'+
      '<button data-p="0">เต็มหน้า</button><button data-p="0.05">ตัดขอบ 5%</button>'+
      '<button data-p="0.1">ตัดขอบ 10%</button><button data-p="0.15">ตัดขอบ 15%</button></div></div>'+
    '<div style="grid-column:1/-1"><label class="f">ใช้กับหน้า</label><input type="text" id="rg" value="ทั้งหมด" placeholder="ทั้งหมด หรือ 1-3, 5"></div>';
  body.appendChild(o);
  const size=el("div","badge");size.style.marginTop="12px";body.appendChild(size);
  [].forEach.call(o.querySelectorAll("#qk button"),b=>b.onclick=()=>{
    const p=+b.dataset.p;box={x:p,y:p,w:1-p*2,h:1-p*2};draw();
  });

  const ui=actionBar(body,"ครอบตัดและบันทึก",async(u)=>{
    if(box.w<.05||box.h<.05)throw new Error("กรอบเล็กเกินไป ลองลากให้กว้างขึ้น");
    const doc=await loadPdf(bytes);
    const pages=doc.getPages();
    const rgv=$("#rg",o).value.trim();
    const idx=(!rgv||/^(ทั้งหมด|all)$/i.test(rgv))?pages.map((p,i)=>i):parseRange(rgv,pages.length);
    idx.forEach(i=>{
      const p=pages[i], m=p.getMediaBox();
      const w=m.width*box.w, h=m.height*box.h;
      const x=m.x+m.width*box.x, y=m.y+m.height*(1-box.y-box.h);
      p.setCropBox(x,y,w,h);p.setMediaBox(x,y,w,h);
    });
    u.prog(.8);await tick();
    save(new Blob([await doc.save()],{type:"application/pdf"}),stem(file.name)+"_ครอบตัด.pdf");
    u.ok("ครอบตัด "+idx.length+" หน้าแล้ว — ดาวน์โหลดแล้ว");
  });
  draw();
};

/* ---------- 13) EXTRACT TEXT ---------- */
BUILD.text=function(body){
  let file=null,result="";
  dropzone(body,"application/pdf",false,fs=>{file=fs[0];info.textContent="📄 "+file.name;ui.enable(true);ui.clear();out.style.display="none";});
  const info=el("div","badge");info.style.marginTop="12px";body.appendChild(info);
  const o=el("div","opts two");
  o.innerHTML='<div><label class="f">คั่นหน้า</label><select id="sep">'+
      '<option value="1">ใส่หัวข้อ “— หน้า 1 —” ทุกหน้า</option><option value="0">ต่อกันทั้งหมด ไม่คั่น</option></select></div>'+
    '<div><label class="f">ช่วงหน้า</label><input type="text" id="rg" value="ทั้งหมด" placeholder="ทั้งหมด หรือ 1-5"></div>';
  body.appendChild(o);
  const out=el("div");out.style.display="none";
  const pre=el("div","txtbox");out.appendChild(pre);
  const t2=el("div","tools2");
  const bCopy=el("button",null,"📋 คัดลอกทั้งหมด"),bTxt=el("button",null,"💾 บันทึกเป็น .txt");
  t2.appendChild(bCopy);t2.appendChild(bTxt);out.appendChild(t2);body.appendChild(out);
  bCopy.onclick=async()=>{
    try{ await navigator.clipboard.writeText(result); bCopy.textContent="✅ คัดลอกแล้ว"; }
    catch(e){ const r=document.createRange();r.selectNodeContents(pre);
      const s=getSelection();s.removeAllRanges();s.addRange(r);bCopy.textContent="เลือกไว้ให้แล้ว กด Ctrl+C"; }
    setTimeout(()=>{bCopy.textContent="📋 คัดลอกทั้งหมด";},2200);
  };
  bTxt.onclick=()=>save(new Blob([result],{type:"text/plain;charset=utf-8"}),stem(file.name)+".txt");
  const ui=actionBar(body,"ดึงข้อความ",async(u)=>{
    const bytes=await bufOf(file);
    const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
    const rgv=$("#rg",o).value.trim();
    const idx=(!rgv||/^(ทั้งหมด|all)$/i.test(rgv))?Array.from({length:doc.numPages},(_,i)=>i):parseRange(rgv,doc.numPages);
    const sep=$("#sep",o).value==="1";
    const chunks=[];
    for(let k=0;k<idx.length;k++){
      const pg=await doc.getPage(idx[k]+1);
      const tc=await pg.getTextContent();
      let line="",lastY=null,txt="";
      tc.items.forEach(it=>{
        const y=Math.round(it.transform[5]);
        if(lastY!==null&&Math.abs(y-lastY)>2){txt+=line.trim()+"\n";line="";}
        line+=it.str+(it.hasEOL?"\n":"");lastY=y;
      });
      txt+=line.trim();
      chunks.push((sep?"— หน้า "+(idx[k]+1)+" —\n":"")+txt.replace(/\n{3,}/g,"\n\n").trim());
      u.prog((k+1)/idx.length);await tick();
    }
    result=chunks.join("\n\n");
    pre.textContent=result||"(ไม่พบข้อความในหน้าที่เลือก)";
    out.style.display="";
    if(!result.replace(/—[^\n]*\n?/g,"").trim())
      u.err("ไฟล์นี้ไม่มีข้อความที่คัดลอกได้ — น่าจะเป็นเอกสารสแกน ต้องใช้ OCR ซึ่งยังไม่มีในเวอร์ชันนี้");
    else u.ok("ดึงข้อความจาก "+idx.length+" หน้า · "+result.length.toLocaleString()+" ตัวอักษร");
  });
};


/* ---------- 14) EDIT PDF ---------- */
BUILD.edit=function(body){
  let file=null,bytes=null,doc=null,pg=0,total=0,scale=1;
  let objs=[],sel=null,mode="pick",hist=[];
  const snap=()=>{hist.push(JSON.stringify(objs));if(hist.length>40)hist.shift();};

  dropzone(body,"application/pdf",false,async fs=>{
    file=fs[0];ui.clear();objs=[];sel=null;hist=[];
    try{
      bytes=await bufOf(file);
      doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
      total=doc.numPages;pg=0;
      stageWrap.style.display="";bar.style.display="";
      await showPage();ui.enable(true);
    }catch(e){ui.err("เปิดไฟล์ไม่ได้ — อาจตั้งรหัสผ่านไว้");}
  },true);

  /* ---- แถบเครื่องมือ ---- */
  const bar=el("div","opts");bar.style.display="none";
  bar.innerHTML='<div><label class="f">เครื่องมือ</label><div class="seg" id="md">'+
      '<button class="on" data-m="pick">👆 เลือก/ย้าย</button>'+
      '<button data-m="rect">⬜ ปิดทับ</button>'+
      '<button data-m="hl">🖍️ ไฮไลต์</button>'+
      '<button data-m="text">✍️ ข้อความ</button>'+
      '<button data-m="sign">🖊️ ลายเซ็น</button>'+
      '<button data-m="img">🖼️ รูป</button></div></div>'+
    '<div id="tw" style="display:none"><label class="f">ข้อความที่จะวาง</label>'+
      '<input type="text" id="txt" value="สำเนาถูกต้อง" placeholder="พิมพ์ภาษาไทยได้"></div>';
  body.appendChild(bar);

  /* ---- พื้นที่หน้ากระดาษ ---- */
  const stageWrap=el("div","preview");stageWrap.style.display="none";
  const nav=el("div","pagenav");
  const bPrev=el("button","mini","‹"),bNext=el("button","mini","›");
  const lbl=el("span");lbl.style.fontSize="13px";
  const bUndo=el("button","mini","↶"),bDel=el("button","mini","🗑");
  bUndo.title="ย้อนกลับ";bDel.title="ลบชิ้นที่เลือก";
  nav.appendChild(bPrev);nav.appendChild(lbl);nav.appendChild(bNext);
  const sp=el("span");sp.style.flex="1";nav.appendChild(sp);
  nav.appendChild(bUndo);nav.appendChild(bDel);
  stageWrap.appendChild(nav);
  const stage=el("div","editstage");
  const cv=el("canvas");stage.appendChild(cv);
  const layer=el("div","editlayer");stage.appendChild(layer);
  stageWrap.appendChild(stage);
  stageWrap.appendChild(el("div","hint","เลือกเครื่องมือแล้วลากบนหน้ากระดาษ · แตะชิ้นงานเพื่อเลือก แล้วลากย้ายหรือย่อขยายที่มุมขวาล่าง"));
  body.appendChild(stageWrap);

  /* ---- แถบตั้งค่าชิ้นที่เลือก ---- */
  const prop=el("div","opts two");prop.style.display="none";
  prop.innerHTML='<div><label class="f">สี</label><div class="row"><input type="color" id="pc" value="#FFFFFF">'+
      '<span style="font-size:12.5px;color:var(--muted)">สีกล่อง/ตัวอักษร</span></div></div>'+
    '<div><label class="f">ความจาง <b id="pov">100%</b></label><input type="range" id="po" min="10" max="100" value="100"></div>'+
    '<div id="fsw"><label class="f">ขนาดตัวอักษร <b id="pfv">3.0%</b></label><input type="range" id="pf" min="10" max="120" value="30"></div>';
  body.appendChild(prop);

  [].forEach.call(bar.querySelectorAll("#md button"),b=>b.onclick=async()=>{
    [].forEach.call(bar.querySelectorAll("#md button"),x=>x.classList.remove("on"));
    b.classList.add("on");mode=b.dataset.m;
    $("#tw",bar).style.display=mode==="text"?"":"none";
    if(mode==="sign"){signPad();b.classList.remove("on");mode="pick";
      bar.querySelector('#md button[data-m=pick]').classList.add("on");}
    if(mode==="img"){pickImage();b.classList.remove("on");mode="pick";
      bar.querySelector('#md button[data-m=pick]').classList.add("on");}
  });

  async function showPage(){
    const p=await doc.getPage(pg+1);
    const v1=p.getViewport({scale:1});
    scale=Math.min(2,640/v1.width);
    const vp=p.getViewport({scale:scale});
    cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
    await p.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    lbl.textContent="หน้า "+(pg+1)+" / "+total;
    bPrev.disabled=pg===0;bNext.disabled=pg===total-1;
    paint();
  }
  bPrev.onclick=()=>{if(pg>0){pg--;sel=null;showPage();}};
  bNext.onclick=()=>{if(pg<total-1){pg++;sel=null;showPage();}};
  bUndo.onclick=()=>{if(hist.length){objs=JSON.parse(hist.pop());sel=null;paint();}};
  bDel.onclick=()=>{if(sel){snap();objs.splice(objs.indexOf(sel),1);sel=null;paint();}};

  function paint(){
    layer.innerHTML="";
    objs.filter(o=>o.pg===pg).forEach(o=>{
      const d=el("div","eobj"+(o===sel?" sel":""));
      d.style.left=(o.x*100)+"%";d.style.top=(o.y*100)+"%";
      if(o.t==="text"){
        d.classList.add("etext");
        d.style.fontSize=(o.fs*cv.height)+"px";
        d.style.color=o.c;d.style.opacity=o.op;
        d.textContent=o.txt;
      }else{
        d.style.width=(o.w*100)+"%";d.style.height=(o.h*100)+"%";
        if(o.t==="img"){const im=el("img");im.src=o.data;im.style.opacity=o.op;d.appendChild(im);}
        else{d.style.background=o.c;d.style.opacity=o.op;}
      }
      if(o===sel&&o.t!=="text"){const g=el("b");g.dataset.g="1";d.appendChild(g);}
      d.__o=o;layer.appendChild(d);
    });
    if(sel){
      prop.style.display="";
      $("#pc",prop).value=sel.c||"#FFFFFF";
      $("#po",prop).value=Math.round((sel.op||1)*100);
      $("#pov",prop).textContent=Math.round((sel.op||1)*100)+"%";
      $("#fsw",prop).style.display=sel.t==="text"?"":"none";
      if(sel.t==="text"){$("#pf",prop).value=Math.round(sel.fs*1000);
        $("#pfv",prop).textContent=(sel.fs*100).toFixed(1)+"%";}
    }else prop.style.display="none";
  }
  $("#pc",prop).oninput=()=>{if(!sel)return;sel.c=$("#pc",prop).value;paint();};
  $("#po",prop).oninput=()=>{if(!sel)return;sel.op=+$("#po",prop).value/100;
    $("#pov",prop).textContent=$("#po",prop).value+"%";paint();};
  $("#pf",prop).oninput=()=>{if(!sel||sel.t!=="text")return;sel.fs=+$("#pf",prop).value/1000;
    $("#pfv",prop).textContent=(sel.fs*100).toFixed(1)+"%";paint();};

  /* ---- ลาก/สร้าง ---- */
  let dr=null;
  const rel=ev=>{const r=stage.getBoundingClientRect();
    return {x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height};};
  stage.addEventListener("pointerdown",ev=>{
    if(!doc)return;
    const host=ev.target.closest?ev.target.closest(".eobj"):null;
    const p=rel(ev);
    if(host&&host.__o){
      sel=host.__o;
      dr={m:ev.target.dataset&&ev.target.dataset.g?"size":"move",o:sel,p:p,st:Object.assign({},sel)};
      paint();stage.setPointerCapture(ev.pointerId);ev.preventDefault();return;
    }
    if(mode==="rect"||mode==="hl"){
      snap();
      const o={pg:pg,t:mode,x:p.x,y:p.y,w:.001,h:.001,
        c:mode==="hl"?"#FFE24D":"#FFFFFF",op:mode==="hl"?.45:1};
      objs.push(o);sel=o;dr={m:"draw",o:o,p:p,st:Object.assign({},o)};
      paint();stage.setPointerCapture(ev.pointerId);ev.preventDefault();return;
    }
    if(mode==="text"){
      const t=$("#txt",bar).value.trim();
      if(!t){ui.err("พิมพ์ข้อความก่อนวางนะคะ");return;}
      snap();
      const o={pg:pg,t:"text",x:p.x,y:p.y,txt:t,fs:.03,c:"#D0021B",op:1};
      objs.push(o);sel=o;paint();return;
    }
    sel=null;paint();
  });
  stage.addEventListener("pointermove",ev=>{
    if(!dr)return;
    const p=rel(ev),o=dr.o,st=dr.st,dx=p.x-dr.p.x,dy=p.y-dr.p.y;
    const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
    if(dr.m==="draw"){o.x=Math.min(dr.p.x,p.x);o.y=Math.min(dr.p.y,p.y);
      o.w=Math.abs(p.x-dr.p.x);o.h=Math.abs(p.y-dr.p.y);}
    else if(dr.m==="move"){o.x=cl(st.x+dx,-.05,.98);o.y=cl(st.y+dy,-.05,.98);}
    else{o.w=Math.max(.01,st.w+dx);o.h=Math.max(.01,st.h+dy);}
    paint();
  });
  ["pointerup","pointercancel"].forEach(e=>stage.addEventListener(e,()=>{
    if(dr&&dr.m==="draw"&&(dr.o.w<.008||dr.o.h<.008)){objs.splice(objs.indexOf(dr.o),1);sel=null;paint();}
    dr=null;}));

  /* ---- ลายเซ็น ---- */
  function signPad(){
    const bd=el("div","modal");
    bd.innerHTML='<div class="sheet"><b>เซ็นชื่อในกรอบ</b>'+
      '<canvas id="sc" width="640" height="220"></canvas>'+
      '<div class="tools2"><button id="sclr">ล้าง</button><button id="scan">ยกเลิก</button>'+
      '<button id="sok" style="border-color:var(--brand);color:var(--brand)">ใช้ลายเซ็นนี้</button></div></div>';
    document.body.appendChild(bd);
    const c=$("#sc",bd),x=c.getContext("2d");
    x.lineWidth=4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";
    let d=false,used=false;
    const pt=ev=>{const r=c.getBoundingClientRect();
      return [(ev.clientX-r.left)*c.width/r.width,(ev.clientY-r.top)*c.height/r.height];};
    c.addEventListener("pointerdown",ev=>{d=true;used=true;const p=pt(ev);x.beginPath();x.moveTo(p[0],p[1]);
      c.setPointerCapture(ev.pointerId);ev.preventDefault();});
    c.addEventListener("pointermove",ev=>{if(!d)return;const p=pt(ev);x.lineTo(p[0],p[1]);x.stroke();});
    ["pointerup","pointercancel"].forEach(e=>c.addEventListener(e,()=>{d=false;}));
    $("#sclr",bd).onclick=()=>{x.clearRect(0,0,c.width,c.height);used=false;};
    $("#scan",bd).onclick=()=>bd.remove();
    $("#sok",bd).onclick=()=>{
      if(!used){bd.remove();return;}
      snap();
      const o={pg:pg,t:"img",x:.55,y:.75,w:.3,h:.3*(c.height/c.width),data:c.toDataURL("image/png"),op:1};
      objs.push(o);sel=o;bd.remove();paint();
    };
  }
  /* ---- แปะรูป ---- */
  function pickImage(){
    const inp=el("input");inp.type="file";inp.accept=IMG_ACCEPT;
    inp.onchange=async()=>{
      if(!inp.files[0])return;
      try{
        const c=resizeCanvas(await fileToCanvas(inp.files[0]),1400);
        snap();
        const w=.35,o={pg:pg,t:"img",x:.1,y:.1,w:w,h:w*(c.height/c.width)*(cv.width/cv.height),
          data:c.toDataURL("image/png"),op:1};
        objs.push(o);sel=o;paint();
      }catch(e){ui.err(e.message||"เปิดรูปไม่ได้");}
    };
    inp.click();
  }

  const ui=actionBar(body,"บันทึกไฟล์ที่แก้แล้ว",async(u)=>{
    if(!objs.length)throw new Error("ยังไม่มีการแก้ไข ลองวางกล่องหรือข้อความก่อนนะคะ");
    const out=await loadPdf(bytes);
    const pages=out.getPages();
    for(let i=0;i<objs.length;i++){
      const o=objs[i],p=pages[o.pg];
      if(!p)continue;
      const m=p.getMediaBox(),W=m.width,H=m.height;
      if(o.t==="text"){
        const st=textPng(o.txt,o.c,600);
        const img=await out.embedPng(st.url);
        const hh=H*o.fs*1.35, ww=hh*(st.w/st.h);
        p.drawImage(img,{x:m.x+W*o.x,y:m.y+H*(1-o.y)-hh,width:ww,height:hh,opacity:o.op});
      }else if(o.t==="img"){
        const img=await out.embedPng(o.data);
        p.drawImage(img,{x:m.x+W*o.x,y:m.y+H*(1-o.y-o.h),width:W*o.w,height:H*o.h,opacity:o.op});
      }else{
        const c=unhex(o.c);
        p.drawRectangle({x:m.x+W*o.x,y:m.y+H*(1-o.y-o.h),width:W*o.w,height:H*o.h,
          color:PDFLib.rgb(c[0]/255,c[1]/255,c[2]/255),opacity:o.op});
      }
      u.prog((i+1)/objs.length);await tick();
    }
    save(new Blob([await out.save()],{type:"application/pdf"}),stem(file.name)+"_แก้ไข.pdf");
    u.ok("บันทึกแล้ว · แก้ไข "+objs.length+" จุด");
  });
};


/* ═══════════════════════════════════════════════════════════════════
   ส่วนเพิ่มเติม: PDF → Excel · PDF → Word · ย่อขนาดไฟล์รูป
   (ทำงานออฟไลน์ทั้งหมด ใช้ pdf.js + JSZip ที่ฝังอยู่ในไฟล์นี้แล้ว)
   ═══════════════════════════════════════════════════════════════════ */

/* ---------- ตัวช่วยตรวจจับตารางจากพิกัดตัวอักษรใน PDF ---------- */
const tbMedian=a=>{const s=a.slice().sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:0;};
/* จัดชิ้นข้อความเป็นแถวตามพิกัด y */
function tbRows(items){
  if(!items.length)return[];
  const med=tbMedian(items.map(i=>i.h))||10, tol=Math.max(2,med*0.5);
  const sorted=items.slice().sort((a,b)=>(b.y-a.y)||(a.x-b.x));
  const rows=[];let cur=[sorted[0]];
  for(let i=1;i<sorted.length;i++){
    const it=sorted[i], refY=cur.reduce((s,x)=>s+x.y,0)/cur.length;
    if(Math.abs(it.y-refY)<=tol)cur.push(it);else{rows.push(cur);cur=[it];}
  }
  rows.push(cur);
  return rows.map(r=>r.sort((a,b)=>a.x-b.x));
}
/* รวมชิ้นที่ต่อเนื่องกันในบรรทัดเดียวเป็นเซลล์เดียว เช่น ชื่อ + นามสกุล */
function tbMerge(row,gapTol){
  const out=[];
  for(let i=0;i<row.length;i++){
    const it=row[i], last=out[out.length-1];
    if(last){
      const gap=it.x-(last.x+last.w);
      if(gap<=gapTol){last.s+=(gap>0.8?" ":"")+it.s;last.w=(it.x+it.w)-last.x;last.h=Math.max(last.h,it.h);continue;}
    }
    out.push({s:it.s,x:it.x,y:it.y,w:it.w,h:it.h,f:it.f});
  }
  return out;
}
/* หาเส้นคอลัมน์จากตำแหน่ง x ที่ซ้ำกันหลายแถว และตัดคอลัมน์ที่ชิดกันเกินไป */
function tbCols(rows,tol,minRatio){
  const xs=[];rows.forEach(r=>r.forEach(it=>xs.push(it.x)));
  if(!xs.length)return[];
  xs.sort((a,b)=>a-b);
  const cl=[];let cur=[xs[0]];
  for(let i=1;i<xs.length;i++){
    if(xs[i]-cur[cur.length-1]<=tol)cur.push(xs[i]);else{cl.push(cur);cur=[xs[i]];}
  }
  cl.push(cur);
  const minN=Math.max(2,Math.ceil(rows.length*minRatio));
  const keep=[];
  cl.filter(c=>c.length>=minN).map(c=>({x:Math.min.apply(null,c),n:c.length})).forEach(c=>{
    const last=keep[keep.length-1];
    if(last&&c.x-last.x<22){if(c.n>last.n)keep[keep.length-1]=c;}
    else keep.push(c);
  });
  return keep.map(c=>c.x);
}
function tbTable(rows,cols,tol){
  if(!cols.length)return[];
  return rows.map(r=>{
    const cells=new Array(cols.length).fill("");
    r.forEach(it=>{
      let ci=0;
      for(let i=0;i<cols.length;i++)if(it.x>=cols[i]-tol)ci=i;
      cells[ci]=cells[ci]?cells[ci]+" "+it.s.trim():it.s.trim();
    });
    return cells;
  }).filter(r=>r.some(c=>c!==""));
}
/* แปลงข้อความเป็นตัวเลขเมื่อควรเป็นตัวเลข แต่คงรหัส/เบอร์โทรที่ขึ้นต้นด้วย 0 */
function tbVal(v){
  const t=String(v).trim();
  if(!t)return "";
  if(/^0\d+$/.test(t))return t;
  if(/^-?[\d,]+(\.\d+)?$/.test(t)&&/\d/.test(t))return Number(t.replace(/,/g,""));
  return t;
}
/* ดึงชิ้นข้อความพร้อมพิกัดจากหน้า PDF */
async function tbItems(pg){
  const tc=await pg.getTextContent();
  const items=[];
  tc.items.forEach(it=>{
    if(!it.str||!it.str.trim())return;
    items.push({s:it.str,x:it.transform[4],y:it.transform[5],
      w:it.width||0,h:it.height||Math.abs(it.transform[3])||10,
      f:(tc.styles&&tc.styles[it.fontName]&&tc.styles[it.fontName].fontFamily)||""});
  });
  return items;
}
/* หน้า → ตาราง */
function tbPage(items,opt){
  const med=tbMedian(items.map(i=>i.h))||10;
  const rows=tbRows(items).map(r=>tbMerge(r,med*opt.gap));
  const cols=tbCols(rows,opt.tol,opt.strict);
  return {rows:rows,cols:cols,table:tbTable(rows,cols,opt.tol),med:med};
}

/* ---------- ตัวสร้างไฟล์ .xlsx จริง (ไม่ต้องพึ่งไลบรารีภายนอก) ---------- */
function mkXlsx(sheets){
  const xe=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const colName=n=>{let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  const used={},names=sheets.map((s,i)=>{
    let nm=String(s.name||("Sheet"+(i+1))).replace(/[\[\]\*\/\\\?:]/g,"-").slice(0,31)||("Sheet"+(i+1));
    const base=nm;let k=2;while(used[nm]){nm=base.slice(0,28)+"_"+k;k++;}
    used[nm]=1;return nm;
  });
  const zip=new JSZip();
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+
    '</Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  zip.file("xl/workbook.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    names.map((n,i)=>'<sheet name="'+xe(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+'</sheets></workbook>');
  zip.file("xl/_rels/workbook.xml.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'</Relationships>');
  sheets.forEach((s,i)=>{
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    s.rows.forEach((r,ri)=>{
      x+='<row r="'+(ri+1)+'">';
      r.forEach((v,ci)=>{
        if(v===""||v===null||v===undefined)return;
        const ref=colName(ci)+(ri+1);
        if(typeof v==="number"&&isFinite(v))x+='<c r="'+ref+'"><v>'+v+'</v></c>';
        else x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
      });
      x+='</row>';
    });
    zip.file("xl/worksheets/sheet"+(i+1)+".xml",x+'</sheetData></worksheet>');
  });
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
/* ตัวสร้างไฟล์ .doc ที่ Word / Google Docs เปิดได้ */
function mkDoc(innerHtml,title){
  const he=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>'+he(title)+'</title>'+
    '<style>@page{size:A4;margin:2cm}body{font-family:"TH Sarabun New","Sarabun",sans-serif;font-size:16pt;line-height:1.6}'+
    'table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:4pt 6pt}h2{font-size:20pt}h3{font-size:18pt}</style></head><body>'+innerHtml+'</body></html>';
  return new Blob(["\ufeff"+html],{type:"application/msword"});
}
/* ตารางพรีวิวในหน้าเว็บ */
function tbPreview(tbl,cap){
  cap=cap||60;
  const he=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const head=tbl[0]||[];
  return '<div style="overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:12px">'+
    '<table style="border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap"><thead><tr>'+
    head.map((h,i)=>'<th style="position:sticky;top:0;background:var(--surface);border-bottom:2px solid var(--line);padding:7px 10px;text-align:left">'+(he(h)||("คอลัมน์ "+(i+1)))+'</th>').join("")+
    '</tr></thead><tbody>'+
    tbl.slice(1,cap).map(r=>'<tr>'+head.map((_,c)=>'<td style="border-bottom:1px solid var(--line);padding:6px 10px">'+he(r[c])+'</td>').join("")+'</tr>').join("")+
    '</tbody></table></div>'+
    (tbl.length>cap?'<div style="font-size:12px;color:var(--muted);margin-top:8px">แสดง '+cap+' แถวแรก · ไฟล์ที่บันทึกมีครบทุกแถว</div>':"");
}

  const prev=el("div");prev.style.marginTop="14px";prev.style.display="none";body.appendChild(prev);

    const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
    const rgv=$("#rg",o).value.trim();

        const s=String(v==null?"":v);
        return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;

      save(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),nm+".csv");
      u.ok("แปลงแล้ว "+rowCount+" แถว · บันทึกเป็น CSV — ดาวน์โหลดแล้ว");
    }else{
      save(await mkXlsx(sheets),nm+".xlsx");
      u.ok("แปลงแล้ว "+sheets.length+" ชีต · "+rowCount+" แถว · สูงสุด "+maxCol+" คอลัมน์ — ดาวน์โหลดแล้ว");
    }
  });
};

    '<div><label class="f">รูปแบบเอกสาร</label><select id="md"><option value="flow">ข้อความไหล — จดหมาย/บันทึกข้อความ</option><option value="table">คงตาราง — ไฟล์ที่เป็นตารางเป็นหลัก</option></select></div>'+

    '<div><label class="f">ใส่หมายเลขหน้าคั่น</label><select id="mk"><option value="0">ไม่ใส่</option><option value="1">ใส่ “— หน้า N —”</option></select></div>'+
    '<div><label class="f">ความไวการแยกคอลัมน์ (โหมดตาราง)</label><select id="tol"><option value="8">ละเอียด</option><option value="14" selected>ปกติ</option><option value="24">หยาบ</option></select></div>';
  body.appendChild(o);
  body.appendChild(el("div","warn","ℹ️ ไฟล์ .doc ที่ได้จะคงข้อความ หัวข้อ ย่อหน้า และตาราง แต่ไม่คงตำแหน่งรูปภาพและหัว-ท้ายกระดาษ เพราะ PDF ไม่ได้เก็บโครงสร้างเอกสารไว้"));
  const prev=el("div");prev.style.marginTop="14px";prev.style.display="none";body.appendChild(prev);
  const ui=actionBar(body,"แปลงเป็น Word",async(u)=>{
    const he=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const opt={tol:+$("#tol",o).value,gap:1.5,strict:0.4};
    const mode=$("#md",o).value, paraMul=+$("#pa",o).value, useHead=$("#hd",o).value==="1", mark=$("#mk",o).value==="1";
    const bytes=await bufOf(file);
    const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
    const rgv=$("#rg",o).value.trim();
    const idx=(!rgv||/^(ทั้งหมด|all)$/i.test(rgv))?Array.from({length:doc.numPages},(_,i)=>i):parseRange(rgv,doc.numPages);
    const parts=[];
    for(let k=0;k<idx.length;k++){
      const items=await tbItems(await doc.getPage(idx[k]+1));
      let bodyHtml="";
      if(items.length){
        const med=tbMedian(items.map(i=>i.h))||10;
        const rows=tbRows(items).map(r=>tbMerge(r,med*opt.gap));
        let done=false;
        if(mode==="table"){
          const cols=tbCols(rows,opt.tol,opt.strict), tbl=tbTable(rows,cols,opt.tol);

            done=true;
          }
        }
        if(!done){
          const minX=Math.min.apply(null,rows.map(r=>r[0].x));
          const out=[];let buf="",lastY=null;
          const flush=()=>{if(buf.trim())out.push("<p>"+buf.trim()+"</p>");buf="";};
          rows.forEach(r=>{
            const text=r.map(it=>he(it.s.trim())).join(" ").replace(/\s+/g," ");
            const maxH=Math.max.apply(null,r.map(it=>it.h));
            const bold=r.some(it=>/bold|black|heavy/i.test(it.f||""));
            const y=r[0].y, indent=r[0].x>minX+14, gap=lastY===null?0:Math.abs(lastY-y);
            if(useHead&&maxH>=med*1.22){flush();out.push(maxH>=med*1.6?"<h2>"+text+"</h2>":"<h3>"+text+"</h3>");}
            else{
              if(lastY!==null&&(gap>med*paraMul||indent))flush();
              buf+=(buf?" ":"")+(bold?"<b>"+text+"</b>":text);
            }
            lastY=y;
          });
          flush();
          bodyHtml=out.join("\n");
        }
      }
      if(bodyHtml)parts.push((parts.length?'<div style="page-break-before:always"></div>':"")+(mark?'<p style="color:#888;font-size:10pt">— หน้า '+(idx[k]+1)+' —</p>':"")+bodyHtml);
      u.prog((k+1)/idx.length);await tick();
    }
    if(!parts.length)throw new Error("ไฟล์นี้ไม่มีข้อความที่คัดลอกได้ — น่าจะเป็นเอกสารสแกน");
    const html=parts.join("\n");
    prev.innerHTML='<label class="f">ตัวอย่างเอกสารที่แปลงได้</label>'+
      '<div style="max-height:360px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 24px;line-height:1.8">'+html+'</div>';

    save(mkDoc(html,nm),nm+".doc");
    u.ok("แปลงแล้ว "+parts.length+" หน้า · เปิดแก้ไขใน Word ได้ทันที — ดาวน์โหลดแล้ว");
  });
};

        c=flatten(c,"#FFFFFF");            /* JPG/WebP ไม่มีพื้นโปร่ง ต้องเติมขาวก่อน */
        let quality=q0, blob=await canvasToBlob(c,ext,quality), shrunk=0;
        /* ไล่ลดคุณภาพลงทีละขั้นจนได้ตามเป้า ถ้ายังไม่พอค่อยย่อขนาดภาพ */
        while(target&&blob.size>target&&(quality>0.35||shrunk<5)){
          if(quality>0.35){quality=Math.max(0.35,quality-0.1);}
          else{
            const side=Math.max(c.width,c.height);
            c=resizeCanvas(c,Math.round(side*0.82));shrunk++;quality=Math.min(0.8,q0);
          }
          blob=await canvasToBlob(c,ext,quality);
          await tick();
        }
        const nm=stem(f.name)+"_เล็ก."+ext;
        before+=f.size;after+=blob.size;
        report.push(f.name+": "+fmt(f.size)+" → "+fmt(blob.size));
        if(zip)zip.file(nm,blob);else save(blob,nm);
      }catch(e){failed.push(f.name);}
      u.prog((i+1)/files.length);await tick();
    }
    if(!report.length)throw new Error("ย่อไม่สำเร็จสักไฟล์ — ตรวจสอบว่าเป็นไฟล์รูปที่เปิดได้จริง");
    if(zip)save(await zip.generateAsync({type:"blob"}),"รูปย่อขนาด.zip");
    const pct=before?Math.max(0,Math.round((1-after/before)*100)):0;
    u.ok("ย่อแล้ว "+report.length+" รูป · "+fmt(before)+" → "+fmt(after)+" (เล็กลง "+pct+"%)"+
      (failed.length?" · ข้าม "+failed.length+" ไฟล์ที่เปิดไม่ได้":""));
  });
  draw();
};




})();
</script>



<script>
/* ═══════════════════════════════════════════════════════════
   DocDesk PWA — ฝั่งหน้าเว็บ
   • ลงทะเบียน Service Worker เพื่อใช้งานออฟไลน์
   • ปุ่มติดตั้งแอปลงหน้าจอโฮม
   • แจ้งเตือนเมื่อมีเวอร์ชันใหม่
   ═══════════════════════════════════════════════════════════ */
(function(){
  var CSS = ''
  + '.pwa-fab{position:fixed;right:16px;bottom:16px;z-index:9999;display:none;align-items:center;gap:8px;'
  + 'font-family:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;font-size:14px;font-weight:500;'
  + 'padding:11px 18px;border-radius:999px;border:none;cursor:pointer;'
  + 'background:#4B31E0;color:#fff;box-shadow:0 6px 20px rgba(75,49,224,.35)}'
  + '.pwa-fab:hover{background:#3a25b8}'
  + '.pwa-fab.on{display:inline-flex}'
  + '.pwa-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140px);z-index:10000;'
  + 'display:flex;align-items:center;gap:12px;max-width:92vw;padding:12px 16px;border-radius:14px;'
  + 'font-family:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;font-size:14px;'
  + 'background:#1b1826;color:#f2effa;box-shadow:0 10px 34px rgba(0,0,0,.35);transition:transform .32s cubic-bezier(.2,1.4,.5,1)}'
  + '.pwa-bar.on{transform:translateX(-50%) translateY(0)}'
  + '.pwa-bar button{font-family:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:9px;border:none;cursor:pointer}'
  + '.pwa-bar .go{background:#4ED88A;color:#06281a}'
  + '.pwa-bar .later{background:rgba(255,255,255,.12);color:#f2effa}'
  + '.pwa-tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10000;max-width:92vw;'
  + 'padding:14px 18px;border-radius:14px;font-family:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;'
  + 'font-size:14px;line-height:1.7;background:#1b1826;color:#f2effa;box-shadow:0 10px 34px rgba(0,0,0,.35);display:none}'
  + '.pwa-tip.on{display:block}'
  + '.pwa-tip button{margin-top:10px;font-family:inherit;font-size:13px;padding:7px 14px;border-radius:9px;'
  + 'border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#f2effa}';

  var style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  /* ---------- ปุ่มติดตั้งแอป ---------- */
  var fab = document.createElement('button');
  fab.className = 'pwa-fab';
  fab.type = 'button';
  fab.textContent = '⬇ ติดตั้งเป็นแอป';
  document.body.appendChild(fab);

  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if (!standalone && localStorage.getItem('pwa-install-hide') !== '1') fab.classList.add('on');
  });
  fab.addEventListener('click', function(){
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; fab.classList.remove('on'); });
    } else if (isIOS) {
      showIOSTip();
    }
  });
  window.addEventListener('appinstalled', function(){
    fab.classList.remove('on');
    try { localStorage.setItem('pwa-install-hide','1'); } catch(e){}
  });

  /* iPhone ไม่มีปุ่มติดตั้งอัตโนมัติ ต้องบอกวิธีทำเอง */
  function showIOSTip(){
    var tip = document.createElement('div');
    tip.className = 'pwa-tip on';
    tip.innerHTML = '<b>วิธีติดตั้งบน iPhone</b><br>' +
      '1. กดปุ่มแชร์ <span style="font-size:16px">⬆️</span> ด้านล่างจอ<br>' +
      '2. เลื่อนหา “เพิ่มไปยังหน้าจอโฮม”<br>' +
      '3. กด “เพิ่ม” มุมขวาบน<br>' +
      '<small style="opacity:.75">ต้องเปิดด้วย Safari เท่านั้น</small><br>' +
      '<button type="button">เข้าใจแล้ว</button>';
    document.body.appendChild(tip);
    tip.querySelector('button').onclick = function(){ tip.remove(); };
  }
  if (isIOS && !standalone && localStorage.getItem('pwa-install-hide') !== '1') {
    setTimeout(function(){ fab.classList.add('on'); }, 2500);
  }

  /* ---------- Service Worker ---------- */
  if (!('serviceWorker' in navigator)) return;

  var bar = document.createElement('div');
  bar.className = 'pwa-bar';
  bar.innerHTML = '<span>มีเวอร์ชันใหม่พร้อมใช้งาน</span>' +
                  '<button type="button" class="go">อัปเดตเลย</button>' +
                  '<button type="button" class="later">ไว้ก่อน</button>';
  document.body.appendChild(bar);

  var waitingWorker = null;
  var reloading = false;

  bar.querySelector('.later').onclick = function(){ bar.classList.remove('on'); };
  bar.querySelector('.go').onclick = function(){
    bar.classList.remove('on');
    if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  };

  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloading) return;
    reloading = true;
    window.location.reload();
  });

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(function(reg){
      /* มีเวอร์ชันใหม่รออยู่แล้วตั้งแต่เปิดหน้า */
      if (reg.waiting && navigator.serviceWorker.controller) {
        waitingWorker = reg.waiting;
        bar.classList.add('on');
      }
      /* ตรวจพบเวอร์ชันใหม่ระหว่างใช้งาน */
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            waitingWorker = nw;
            bar.classList.add('on');
          }
        });
      });
      /* ตรวจหาเวอร์ชันใหม่ทุกครั้งที่กลับมาที่หน้านี้ */
      document.addEventListener('visibilitychange', function(){
        if (!document.hidden) { try { reg.update(); } catch(e){} }
      });
    }).catch(function(){ /* ลงทะเบียนไม่สำเร็จ โปรแกรมยังใช้งานได้ปกติ */ });
  });
})();
</script>
